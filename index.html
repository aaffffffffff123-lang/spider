const HC = 16, HX0 = -320, HY0 = -320, HWC = Math.ceil((VW + 640) / HC), HHC = Math.ceil((VH + 640) / HC);

function rebuildHash(){

    if (DEAD[i]) continue;

  const r0 = Math.max(0, Math.floor((y - r - HY0) / HC)), r1 = Math.min(HHC - 1, Math.floor((y + r - HY0) / HC));
  for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) for (let i = hHead[cy * HWC + cx]; i >= 0; i = hNext[i]) fn(i);

  {birds: 0.25, cicada: 0, crickets: 0.5, road: 1, fall: 'dust', minor: true, motes: 'leaf'},    // autumn afternoon

const STAGE_AT = {};

/* ---------- now and then the ground trembles (a truck on the road): everything shivers in place, nothing breaks ---------- */
let quake = null, quakeIn = 40;
function quakeReset(){ quake = null; quakeIn = rnd(40, 70); }
function startQuake(){
  quake = {t0: clock, dur: rnd(2.4, 3.4), amp: rnd(0.9, 1.4), dropped: false};
  if (auOK()) rumble(quake.dur + 0.4, auNow());

}
function quakeAmp(){ if (!quake) return 0; const u = (clock - quake.t0) / quake.dur; return u < 0 || u > 1 ? 0 : quake.amp * Math.pow(Math.sin(Math.PI * u), 1.5); }
function quakeUpdate(dt){
  if (quake){
    const u = (clock - quake.t0) / quake.dur;
    if (!quake.dropped && u > 0.45){ quake.dropped = true; dropBit(); }
    if (u > 1) quake = null;
  }
  if (phase !== 'build') return;
  if ((quakeIn -= dt) <= 0 && !quake){ startQuake(); quakeIn = rnd(70, 140); }
}

/* ---------- small things: a drop of dew or a speck of dust shaken loose; dew catching the light ---------- */
let bits = [], glints = [], glintT = 0;
function dropBit(){
  let x, y;
  const live = CHAINS.filter(ch => !ch.dead && !ch.snapped && ch.nodes.length > 2);
  if (live.length){ const ch = live[Math.floor(Math.random() * live.length)], n = ch.nodes[1 + Math.floor(Math.random() * (ch.nodes.length - 2))]; x = X[n]; y = Y[n]; }
  else {
    const c = []; for (let i = 0; i < X.length; i++) if (PIN[i] && KIND[i] === K_SURF && Y[i] < GROUND - 140) c.push(i);
    if (!c.length) return;
    const n = c[Math.floor(Math.random() * c.length)]; x = X[n]; y = Y[n];
  }
  bits.push({x, y: y + 1.5, vx: 0, vy: 0, kind: season().fall, t0: clock, land: -1});
}
function bitsUpdate(dt){
  if (!bits.length) return;
  const w = windVec();
  for (const b of bits){
    if (b.land >= 0) continue;
    if (b.kind === 'dew'){ b.vy += 560 * dt; b.vx += (w[0] * 0.25 - b.vx) * Math.min(1, dt * 2); }
    else if (b.kind === 'fruit'){ b.vy += 520 * dt; b.vx *= 1 - Math.min(1, dt * 1.5); }   // a scrap of persimmon flicked off by a beak
    else { b.vy += (22 - b.vy) * Math.min(1, dt * 2); b.vx += (w[0] * 0.6 + Math.sin(clock * 3 + b.t0) * 14 - b.vx) * Math.min(1, dt * 1.5); }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y >= GROUND - 1.5){ b.y = GROUND - 1.5; b.land = clock; }
  }
  bits = bits.filter(b => b.land < 0 ? clock - b.t0 < 30 && b.x > -60 && b.x < VW + 60 : clock - b.land < 0.35);
}
function drawBits(){
  for (const b of bits){
    if (b.kind === 'dew'){
      if (b.land >= 0){
        const a = 1 - (clock - b.land) / 0.35, r = 2 + (1 - a) * 4;
        brush([[b.x - r, b.y - 1], [b.x - r * 1.6, b.y - 2.6]], BR.fine, 1601, false, a); brush([[b.x + r, b.y - 1], [b.x + r * 1.6, b.y - 2.6]], BR.fine, 1602, false, a);
        continue;
      }
      const pts = ellipsePts(b.x, b.y, 2.2, 2.7, 12);
      ctx.fillStyle = COL.paper; ctx.fill(polyPath(pts)); brush(pts, BR.fine, 1603, true, 0.9);
      ctx.fillStyle = rgbaOf(COL.glint, 0.95); ctx.beginPath(); ctx.arc(b.x - 0.7, b.y - 0.9, 0.75, 0, TAU); ctx.fill();
    } else if (b.kind === 'fruit'){ if (b.land < 0){ ctx.fillStyle = rgbaOf(COL.persimmon, 0.95); ctx.beginPath(); ctx.ellipse(b.x, b.y, 1.9, 1.4, b.t0 * 7, 0, TAU); ctx.fill(); } }
    else if (b.land < 0){ ctx.fillStyle = rgbaOf(COL.graphite, 0.7); ctx.beginPath(); ctx.arc(b.x, b.y, 0.9, 0, TAU); ctx.fill(); }
  }
}
function glintOn(ch){ const n = ch.nodes; if (n.length < 3) return; const p = n[1 + Math.floor(Math.random() * (n.length - 2))]; if (!DEAD[p]) glints.push({p, t0: clock + rnd(0, 0.3), r: rnd(3.2, 5.2)}); }
function glintsUpdate(dt){
  if (glints.length) glints = glints.filter(g => clock - g.t0 < 0.8 && !DEAD[g.p]);
  if (phase !== 'clear' || !clr || clr.step === 'cheer') return;
  if ((glintT -= dt) > 0) return;
  glintT = rnd(0.3, 0.9);
  const live = CHAINS.filter(ch => !ch.dead && !ch.snapped && ch.type === 'sticky');
  if (live.length) glintOn(live[Math.floor(Math.random() * live.length)]);

  for (const g of glints){
    const a = (clock - g.t0) / 0.8; if (a < 0) continue;
    const e = Math.sin(Math.PI * clamp(a, 0, 1)), x = SX[g.p], y = SY[g.p], r = g.r * e, d = r * 0.42;
    if (r < 0.4) continue;

    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x - d, y + d); ctx.lineTo(x + d, y - d); ctx.stroke();
    ctx.fillStyle = rgbaOf(COL.glint, e); ctx.beginPath(); ctx.arc(x, y, 0.5 + 0.7 * e, 0, TAU); ctx.fill();
  }

/* ---------- drips from the eaves: now and then a drop falls from each spot along the edge of the roof, and cuts any thread in its way ---------- */
let drips = [], dripToast = false, splashes = [];
function dripsUpdate(dt){

  if (!drips.length) return;
  for (const d of drips){
    d.next -= dt;
    if (d.next <= 0){ d.next = d.every * rnd(0.8, 1.2); d.drops.push({x: d.x, y: d.y0, vy: 30}); }
    for (const q of d.drops){
      const ya = q.y; q.vy = Math.min(q.vy + 1100 * dt, 900); q.y += q.vy * dt;
      if (cutUnder(q.x, ya, Math.min(q.y, d.y1)) && phase === 'build' && !dripToast){ dripToast = true; toast('낙숫물에 줄이 끊겼어요. 물방울이 떨어지는 데를 가로지르는 실은 못 버텨요.', 4.5); }
      if (q.y >= d.y1){ q.dead = true; splashes.push({x: q.x, y: d.y1, t0: clock}); }
    }
    if (d.drops.some(q => q.dead)) d.drops = d.drops.filter(q => !q.dead);
  }
}
function cutUnder(x, ya, yb){

    forNear(x, y, 10, i => {
      if (DEAD[i] || KIND[i] !== K_THREAD) return;
      for (const c of ADJ[i]){

      return {c, a, b, L: +L.toFixed(1), t: +sp.t.toFixed(2), al: +al.toFixed(3), F: +F.toFixed(3), R: +R.toFixed(3), ends};
    },
    reach(node, dx, dy){ return ADJ[node].filter(isWalk).map(c => { const o = CI[c] === node ? CJ[c] : CI[c]; return {c, o, dir: +(Math.atan2(Y[o] - Y[node], X[o] - X[node]) * 180 / Math.PI).toFixed(1), len: +Math.hypot(X[o] - X[node], Y[o] - Y[node]).toFixed(1), reach: +edgeReach(node, c, dx, dy).toFixed(3)}; }); },
    slipInfo(){ return {lay: sp.lay ? sp.lay.slipAt : null, cast: sp.cast ? sp.cast.slipAt : null, hang: sp.hang ? sp.hang.slipAt : null, fall: sp.fall ? {...sp.fall} : null, loose: loose.map(L => ({n: L.P.length, pin: L.pin, age: +(clock - L.t0).toFixed(2)}))}; },
    bugT(name, props){ Object.assign(BUGT[name], props); return BUGT[name]; },
    moveTarget(i, x, y){ stage.bugs[i].at = [x, y]; },
    audio(){ return AU.ctx ? {state: AU.ctx.state, amb: !!AU.amb, t: +AU.ctx.currentTime.toFixed(2)} : null; },
    bitList(){ return bits.map(b => [+b.x.toFixed(1), +b.y.toFixed(1), b.kind, b.land]); },
    strum(){ strum(0.032, true); },
    season(i){ seasonOverride = i; render(); return season(); },
    maxZ(){ let m = 0; for (let i = 0; i < X.length; i++) if (!DEAD[i] && KIND[i] === K_THREAD) m = Math.max(m, Math.abs(Z[i])); return m; },
    stretch(){ let worst = 0; for (const ch of CHAINS){ if (ch.dead || ch.snapped) continue; let tot = 0; for (const c of ch.cons){ const i = CI[c], j = CJ[c]; tot += Math.hypot(X[j] - X[i], Y[j] - Y[i], Z[j] - Z[i]); } worst = Math.max(worst, (tot / ch.restTotal - 1) / (ch.brk - 1)); } return worst; },
    renderAudio(sec, plan, si, beds){ return audioCheck(sec, plan, si, beds); }
  };
  async function audioCheck(sec, plan, si, beds){
    // renders the game's own sound functions into an offline buffer, to measure their levels
    const sr = 44100, off = new OfflineAudioContext(2, Math.ceil(sec * sr), sr);
    const keep = {ctx: AU.ctx, master: AU.master, noise: AU.noise, bed: AU.bed, brown: AU.brown, ks: AU.ks, spinG: AU.spinG, spinBP: AU.spinBP, amb: AU.amb, off: AU.off}, keepS = seasonOverride;
    if (si !== undefined) seasonOverride = si;
    try {
      AU.ctx = off; AU.ks = new Map(); AU.off = 0;
      auChain(off, off.destination); ambBuild();
      if (beds !== 'none') for (let t = 0; t < sec; t += 0.12){ AU.off = t; ambBeds(t, gustOf(t)); }
      if (beds === 'road') AU.amb.wg.disconnect(); else if (beds === 'wind') AU.amb.rg.disconnect();
      const P = {
        car: () => carPass(AU.off), bird: () => bird(AU.off), clank: () => clanks(AU.off), siren: () => siren(AU.off),
        cicada: () => cicadas(AU.off, 1), cricket: () => cricket(AU.off), rumble: () => rumble(3.2, AU.off),
        strum: () => { for (let k = 0; k < 5; k++) hum(noteOf(40 + k * 70), 0.032, 0, AU.off + k * 0.17); },
        buildStrum: () => { for (let k = 0; k < 4; k++) hum(noteOf(60 + k * 80), 0.018, 0, AU.off + k * 0.17); },
        hop: () => { for (let k = 0; k < 5; k++) pluck(noteOf(120, k), 0.1, 0, AU.off + 0.09 + k * 0.46); },
        lay: () => pluck(700, 0.15, 0), snap: () => pluck(900, 0.24, 0), thump: () => thump(0.85), whoosh: () => noiseHit(0.5, 500, 3800, 0.6, 0.55),
        storm: () => storm(0.95), tear: () => noiseHit(0.24, 3200, 1300, 0.8, 0.3), land: () => { thump(0.9); noiseHit(0.3, 900, 160, 0.6, 0.32, 'lowpass'); },
        bulbul: () => bulbulCall(0, 0.07), flutter: () => flutter(0, 1.0, 0.08), bus: () => busSound(), slap: () => flyerSlap(), ladder: () => ladderClank()
      };
      for (const [t, what] of plan){ AU.off = t; P[what](); }
    } finally { Object.assign(AU, keep); seasonOverride = keepS; }
    const buf = await off.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, win = Math.floor(sr * 0.1), rows = [], pcm = new Int16Array(n);
    let nan = 0, peak = 0;
    for (let i = 0; i < n; i++){ const v = (L[i] + R[i]) * 0.5; if (!Number.isFinite(v)) nan++; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); pcm[i] = clamp(Math.round(v * 32767), -32768, 32767) || 0; }
    for (let w = 0; w * win < n; w++){ let s2 = 0, p = 0; const e = Math.min(n, (w + 1) * win); for (let i = w * win; i < e; i++){ const v = (L[i] + R[i]) * 0.5; s2 += v * v; p = Math.max(p, Math.abs(v)); } rows.push([+(10 * Math.log10(s2 / (e - w * win) + 1e-12)).toFixed(1), +(20 * Math.log10(p + 1e-9)).toFixed(1)]); }
    const bytes = new Uint8Array(44 + n * 2), dv = new DataView(bytes.buffer), wr = (o, s2) => { for (let i = 0; i < s2.length; i++) bytes[o + i] = s2.charCodeAt(i); };
    wr(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wr(8, 'WAVE'); wr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); wr(36, 'data'); dv.setUint32(40, n * 2, true);
    new Int16Array(bytes.buffer, 44, n).set(pcm);
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return {rows, peak: +(20 * Math.log10(peak + 1e-9)).toFixed(1), nan, wav: btoa(bin)};
  }
  render();
} else requestAnimationFrame(frame);
})();
</script>
