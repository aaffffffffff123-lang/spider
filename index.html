(() => {

const MANUAL = location.hash.startsWith('#manual');

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t); };
const easeIn = t => { t = clamp(t, 0, 1); return t * t; };
function angDiff(a, b){ let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function catmull(pts, seg){
  const out = [];

        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)

}
function hsh(a, b){

function hashStr(s){ let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 100000; }
function rgbaOf(hex, a){ const n = parseInt(hex.replace('#', ''), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function segDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;

}
function pointInPoly(x, y, poly){

    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];

/* ---------- pencil brush: a dark core line with short hairs across it ---------- */
const BOIL_FPS = 7, BOILS = 3;
let boilT = 0;
const boilPhase = () => Math.floor(boilT * BOIL_FPS) % BOILS;

const RED_CORE = rgbaOf(COL.stress, 0.95), RED_HAIR = rgbaOf(COL.stress, 0.72);
const BR = {
  stem:   {cw: 1.0,  jit: 0.45, sp: 0.55, len: 3.2, ang: 1.0, off: 1.1, hw: 0.36},
  leaf:   {cw: 0.75, jit: 0.3,  sp: 0.6,  len: 2.4, ang: 1.0, off: 0.7, hw: 0.32},
  ground: {cw: 1.0,  jit: 0.55, sp: 0.6,  len: 3.0, ang: 1.0, off: 1.1, hw: 0.36},
  sign:   {cw: 0.95, jit: 0.4,  sp: 0.55, len: 2.8, ang: 1.0, off: 0.9, hw: 0.34},
  frame:  {cw: 0.66, jit: 0.4,  sp: 0.5,  len: 3.3, ang: 1.0, off: 0.9, hw: 0.31},
  radius: {cw: 0.62, jit: 0.35, sp: 0.55, len: 3.0, ang: 1.0, off: 0.8, hw: 0.3},
  spiral: {cw: 0.54, jit: 0.35, sp: 0.62, len: 2.7, ang: 1.0, off: 0.7, hw: 0.29},
  body:   {cw: 0.9,  jit: 0.22, sp: 0.42, len: 1.8, ang: 1.0, off: 0.5, hw: 0.32},
  leg:    {cw: 1.45, jit: 0.2,  sp: 0.42, len: 3.0, ang: 1.05, off: 0.6, hw: 0.36},
  fine:   {cw: 0.58, jit: 0.2,  sp: 0.5,  len: 1.6, ang: 1.0, off: 0.4, hw: 0.3},
  grain:  {cw: 0.42, jit: 0.25, sp: 1.1,  len: 1.4, ang: 1.0, off: 0.4, hw: 0.24},
  strap:  {cw: 1.5,  jit: 0.5,  sp: 0.55, len: 3.4, ang: 1.0, off: 1.0, hw: 0.4}
};
const UB = {cw: 1.4, jit: 0.4, sp: 0.75, len: 3.0, ang: 1.0, off: 0.8, hw: 0.42};
const UB2 = {cw: 2.2, jit: 0.45, sp: 0.7, len: 3.4, ang: 1.0, off: 1.0, hw: 0.48};
function hairVals(id, phase, out){
  out[0] = clamp(hsh(id, 11) + (hsh(id, 21 + phase) - 0.5) * 0.35, 0, 1);
  out[1] = hsh(id, 12) - 0.5 + (hsh(id, 31 + phase) - 0.5) * 0.4;
  out[2] = (hsh(id, 13) - 0.5) * 2 + (hsh(id, 41 + phase) - 0.5) * 0.9;
  out[3] = (0.3 + Math.pow(hsh(id, 14), 1.6) * 1.15) * (0.8 + 0.4 * hsh(id, 51 + phase));

const HV = new Float32Array(4);
function brushInto(core, hair, pts, o, phase, seed, closed){
  const n = pts.length; if (n < 2) return;
  const J = o.jit;
  const vx = i => pts[i][0] + (hsh(seed + i, 61 + phase * 2) - 0.5) * 2 * J;
  const vy = i => pts[i][1] + (hsh(seed + i, 62 + phase * 2) - 0.5) * 2 * J;
  core.moveTo(vx(0), vy(0));
  for (let i = 1; i < n; i++) core.lineTo(vx(i), vy(i));
  if (closed) core.lineTo(vx(0), vy(0));

  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++){
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); if (L < 1e-6) continue;
    const nx = -dy / L, ny = dx / L;
    const m = Math.max(1, Math.round(L / o.sp));

      hairVals(id, phase, HV);
      const t = (j + HV[0]) / m;
      const cx = a[0] + dx * t + nx * HV[1] * o.off, cy = a[1] + dy * t + ny * HV[1] * o.off;
      const ang = HV[2] * o.ang, ca = Math.cos(ang), sa = Math.sin(ang);

  const ga = ctx.globalAlpha;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = o.cw; ctx.strokeStyle = cc || INK_CORE; ctx.stroke(core);

function brush(pts, o, seed, closed, alpha, cc, hc){
  const core = new Path2D(), hair = new Path2D();
  brushInto(core, hair, pts, o, boilPhase(), seed, closed);
  strokeArt(core, hair, o, alpha, cc, hc);

function polyPath(pts){ const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function ellipsePts(cx, cy, rx, ry, n, rot){
  const c = Math.cos(rot || 0), s = Math.sin(rot || 0), out = [];
  for (let k = 0; k < n; k++){ const a = k / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x * c - y * s, cy + x * s + y * c]); }
  return out;

function roundRectPts(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);

  const corners = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of corners) for (let k = 0; k <= 4; k++){ const a = a0 + k / 4 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }

/* ---------- view: one comic panel; inside it a fixed 540 x 900 world ---------- */
const VW = 540, VH = 900, GROUND = 800, PCX = VW / 2, PCY = 470, FOC = 520;
let DPR = 1, SW = 1, SH = 1, S = 1, OX = 0, OY = 0, PM = 12, PW = 1, PH = 1, UIS = 1;
let panelArt = null;
let touchUI = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
function measure(){
  SW = Math.max(1, cv.clientWidth); SH = Math.max(1, cv.clientHeight);
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  PM = Math.round(clamp(Math.min(SW, SH) * 0.025, 8, 16));
  PW = Math.max(1, SW - PM * 2); PH = Math.max(1, SH - PM * 2);
  S = Math.min(PW / VW, PH / VH);
  OX = PM + (PW - VW * S) / 2; OY = PM + (PH - VH * S) * 0.62;

  panelArt = buildPanelArt();
}
function buildPanelArt(){
  const x0 = PM, y0 = PM, x1 = SW - PM, y1 = SH - PM;
  const o = {cw: 3.0, jit: 0.45, sp: 1.5, len: 4.2, ang: 0.8, off: 2.0, hw: 0.75};
  const pts = [];
  const edge = (ax, ay, bx, by) => { const L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(L / 14)); for (let i = 0; i < n; i++) pts.push([ax + (bx - ax) * i / n, ay + (by - ay) * i / n]); };

  const out = [];
  for (let ph = 0; ph < BOILS; ph++){ const core = new Path2D(), hair = new Path2D(); brushInto(core, hair, pts, o, ph, 9001, true); out.push({core, hair, o}); }
  return out;
}
// depth: perspective plus a slight oblique slide, so a web pushed toward the viewer visibly bellies down and left
const OBX = 0.5, OBY = -0.85;
function proj(x, y, z){ const s = FOC / (FOC + Math.max(-FOC * 0.6, z)), zc = clamp(z, -200, 200); return [PCX + (x - PCX) * s + zc * OBX, PCY + (y - PCY) * s + zc * OBY, s]; }

/* ---------- sound ---------- */
const AU = {ctx: null, master: null, noise: null, bed: null, brown: null, ks: new Map(), spinG: null, spinBP: null, spinLvl: -1, lastSnap: 0, amb: null, off: null};
// sounds are scheduled at auNow(): the audio clock, or a set time while they are rendered offline for a level check
const auNow = () => AU.off !== null ? AU.off : AU.ctx.currentTime;
function noiseBuf(ac, sec, brown){
  // a loop of noise whose end runs smoothly into its start, so the loop point never clicks
  const sr = ac.sampleRate, n = Math.floor(sr * sec), F = Math.floor(sr * 0.25), x = new Float32Array(n + F);
  let last = 0;
  for (let i = 0; i < n + F; i++){ const w = Math.random() * 2 - 1; if (brown){ last = (last + 0.02 * w) / 1.02; x[i] = last * 3.5; } else x[i] = w; }

  for (let i = 0; i < n; i++) d[i] = i < F ? x[i] * Math.sqrt(i / F) + x[n + i] * Math.sqrt(1 - i / F) : x[i];

}
function auChain(ac, dest){
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(dest);

  AU.noise = noiseBuf(ac, 2, false); AU.bed = noiseBuf(ac, 7, false); AU.brown = noiseBuf(ac, 7, true);
  const src = ac.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 0.8;
  const g = ac.createGain(); g.gain.value = 0;

  AU.spinG = g; AU.spinBP = bp;
}
function auInit(){
  if (AU.ctx){ if (AU.ctx.state !== 'running' && !document.hidden) AU.ctx.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = new AC(); AU.ctx = ac;
    auChain(ac, ac.destination);

const auOK = () => !!(AU.ctx && (AU.off !== null || AU.ctx.state === 'running'));
function ksBuf(freq){
  const key = Math.round(freq / 8) * 8;

function noiseHit(dur, f0, f1, q, vol, type){
  if (!auOK()) return;

/* ---------- the web as an instrument: every frame thread has its note (a long one low, a short one high, all on one scale), and a gust plays them ---------- */
const SCALES = {maj: [0, 2, 4, 7, 9, 12], min: [0, 3, 5, 7, 10, 12]};
function noteOf(len, step){
  const f = 1500 * Math.pow(30 / Math.max(len, 30), 0.62), sc = SCALES[season().minor ? 'min' : 'maj'], base = 261.63;
  const s = 12 * Math.log2(f / base), o = Math.floor(s / 12), r = s - o * 12;
  let bi = 0, bd = 99;
  for (let i = 0; i < sc.length; i++){ const d = Math.abs(r - sc[i]); if (d < bd){ bd = d; bi = i; } }
  const idx = o * 5 + bi + (step || 0), oo = Math.floor(idx / 5);
  return base * Math.pow(2, oo + sc[idx - oo * 5] / 12);
}

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.07); g.gain.setTargetAtTime(0.0001, t + 0.08, 0.6);
  nPan(g, pan).connect(AU.master);
  for (const [m, a] of [[1, 1], [2.003, 0.2], [3.007, 0.06]]){
    const o = ac.createOscillator(), og = nGain(a); o.frequency.value = f * m; o.connect(og); og.connect(g); o.start(t); o.stop(t + 3.2);
  }
}

  for (let i = V.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)), tmp = V[i]; V[i] = V[j]; V[j] = tmp; }
  const n = Math.min(V.length, 1 + Math.floor(V.length / 2.5), 6);
  let t = auOK() ? auNow() + 0.03 : 0;
  for (let k = 0; k < n; k++){
    const ch = V[k], mid = ch.nodes[ch.nodes.length >> 1];

/* ---------- world data: particles and the constraints between them ---------- */
const K_SURF = 0, K_THREAD = 1, K_BUG = 2, K_GROUND = 3;
let X, Y, Z, PX, PY, PZ, BX, BY, PIN, OBJ, DEAD, FX, FY, INV, KIND, STK, SO, SN, ADJ;
let SX = [], SY = [];
let CI, CJ, CR, CB, CK, CCH, CW;
let CHAINS = [], UNDO = [];
function resetWorld(){
  X = []; Y = []; Z = []; PX = []; PY = []; PZ = []; BX = []; BY = []; PIN = []; OBJ = []; DEAD = []; FX = []; FY = []; INV = []; KIND = []; STK = []; SO = []; SN = []; ADJ = [];
  CI = []; CJ = []; CR = []; CB = []; CK = []; CCH = []; CW = [];
  CHAINS = []; UNDO = [];
}
function addP(x, y, z, pin, obj, kind){
  const i = X.length;
  X.push(x); Y.push(y); Z.push(z); PX.push(x); PY.push(y); PZ.push(z); BX.push(x); BY.push(y);
  PIN.push(pin); OBJ.push(obj); DEAD.push(0); FX.push(0); FY.push(0); INV.push(1); KIND.push(kind); STK.push(0); SO.push(0); SN.push(0); ADJ.push([]);
  return i;
}
function addC(i, j, r, k, ch, walk){
  const c = CI.length;
  CI.push(i); CJ.push(j); CR.push(r); CB.push(0); CK.push(k); CCH.push(ch); CW.push(walk ? 1 : 0);
  if (walk){ ADJ[i].push(c); ADJ[j].push(c); }
  return c;
}
function resample(pts, step, closed){
  const P = closed ? [...pts, pts[0]] : pts;
  const out = [P[0].slice()];
  let carry = 0;
  for (let i = 0; i < P.length - 1; i++){
    const a = P[i], b = P[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let d = step - carry;
    while (d <= L){ const t = d / L; out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]); d += step; }
    carry = L - (d - step);
  }
  if (closed){ const l = out[out.length - 1]; if (Math.hypot(l[0] - P[0][0], l[1] - P[0][1]) < step * 0.5) out.pop(); }
  else { const e = P[P.length - 1], l = out[out.length - 1]; if (Math.hypot(l[0] - e[0], l[1] - e[1]) > step * 0.3) out.push(e.slice()); else out[out.length - 1] = e.slice(); }
  return out;
}
function addSurface(pts, obj, kind, closed){
  const ids = resample(pts, 6, closed).map(p => addP(p[0], p[1], 0, 1, obj, kind));
  for (let k = 0; k < ids.length - 1; k++) addC(ids[k], ids[k + 1], 0, 0, -1, true);
  if (closed && ids.length > 2) addC(ids[ids.length - 1], ids[0], 0, 0, -1, true);
  return ids;
}
function joinSurf(a, b){ if (a !== b) addC(a, b, 0, 0, -1, true); }
function nearestOf(ids, x, y){ let b = -1, bd = 1e9; for (const i of ids){ const d = Math.hypot(X[i] - x, Y[i] - y); if (d < bd){ bd = d; b = i; } } return b; }

const SILK = {drag: {k: 0.92, brk: 1.34, seg: 8}, sticky: {k: 0.32, brk: 2.1, seg: 6}};
function makeChain(ia, ib, type, restScale, how){
  const T = SILK[type];
  const ax = X[ia], ay = Y[ia], az = Z[ia], bx = X[ib], by = Y[ib], bz = Z[ib];
  const D = Math.hypot(bx - ax, by - ay, bz - az);
  const n = Math.max(1, Math.round(D / T.seg));
  const id = CHAINS.length, nodes = [ia];
  for (let k = 1; k < n; k++){ const t = k / n; nodes.push(addP(lerp(ax, bx, t), lerp(ay, by, t), lerp(az, bz, t), 0, -1, K_THREAD)); }
  nodes.push(ib);
  const rest = D / n * restScale, cons = [];
  for (let k = 0; k < n; k++) cons.push(addC(nodes[k], nodes[k + 1], rest, T.k, id, true));
  const ch = {id, type, how, nodes, cons, restTotal: rest * n, brk: T.brk, snapped: false, dead: false, cost: D, born: clock};
  CHAINS.push(ch);
  return ch;
}
function splitChain(ch, a, b, t){
  // a new node on the thread between neighbours a and b, a fraction t of the way from a
  const ia = ch.nodes.indexOf(a), ib = ch.nodes.indexOf(b);
  if (ia < 0 || ib < 0 || Math.abs(ia - ib) !== 1) return -1;
  const lo = Math.min(ia, ib), first = ch.nodes[lo], second = ch.nodes[lo + 1], c = ch.cons[lo];
  if (CB[c]) return -1;
  const u = first === a ? t : 1 - t;
  const P = addP(lerp(X[first], X[second], u), lerp(Y[first], Y[second], u), lerp(Z[first], Z[second], u), 0, -1, K_THREAD);
  PX[P] = lerp(PX[first], PX[second], u); PY[P] = lerp(PY[first], PY[second], u); PZ[P] = lerp(PZ[first], PZ[second], u);

/* ---------- now and then the ground trembles (a truck on the road): everything shivers in place, nothing breaks ---------- */
let quake = null, quakeIn = 40;
function quakeReset(){ quake = null; quakeIn = rnd(40, 70); }
function startQuake(){
  quake = {t0: clock, dur: rnd(2.4, 3.4), amp: rnd(0.9, 1.4), dropped: false};
  if (auOK()) rumble(quake.dur + 0.4, auNow());
  vib([14, 60, 10, 80, 18, 50, 12, 90, 8, 120, 6]);
}
function quakeAmp(){ if (!quake) return 0; const u = (clock - quake.t0) / quake.dur; return u < 0 || u > 1 ? 0 : quake.amp * Math.pow(Math.sin(Math.PI * u), 1.5); }
function quakeUpdate(dt){
  if (quake){
    const u = (clock - quake.t0) / quake.dur;
    if (!quake.dropped && u > 0.45){ quake.dropped = true; dropBit(); }
    if (u > 1) quake = null;
  }
  if (phase !== 'build') return;
  if ((quakeIn -= dt) <= 0 && !quake){ startQuake(); quakeIn = rnd(70, 140); }
}

/* ---------- small things: a drop of dew or a speck of dust shaken loose; dew catching the light ---------- */
let bits = [], glints = [], glintT = 0;
function dropBit(){
  let x, y;
  const live = CHAINS.filter(ch => !ch.dead && !ch.snapped && ch.nodes.length > 2);
  if (live.length){ const ch = live[Math.floor(Math.random() * live.length)], n = ch.nodes[1 + Math.floor(Math.random() * (ch.nodes.length - 2))]; x = X[n]; y = Y[n]; }
  else {
    const c = []; for (let i = 0; i < X.length; i++) if (PIN[i] && KIND[i] === K_SURF && Y[i] < GROUND - 140) c.push(i);
    if (!c.length) return;
    const n = c[Math.floor(Math.random() * c.length)]; x = X[n]; y = Y[n];
  }
  bits.push({x, y: y + 1.5, vx: 0, vy: 0, kind: season().fall, t0: clock, land: -1});
}
function bitsUpdate(dt){
  if (!bits.length) return;
  const w = windVec();
  for (const b of bits){
    if (b.land >= 0) continue;
    if (b.kind === 'dew'){ b.vy += 560 * dt; b.vx += (w[0] * 0.25 - b.vx) * Math.min(1, dt * 2); }
    else { b.vy += (22 - b.vy) * Math.min(1, dt * 2); b.vx += (w[0] * 0.6 + Math.sin(clock * 3 + b.t0) * 14 - b.vx) * Math.min(1, dt * 1.5); }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y >= GROUND - 1.5){ b.y = GROUND - 1.5; b.land = clock; }
  }
  bits = bits.filter(b => b.land < 0 ? clock - b.t0 < 30 && b.x > -60 && b.x < VW + 60 : clock - b.land < 0.35);
}
function drawBits(){
  for (const b of bits){
    if (b.kind === 'dew'){
      if (b.land >= 0){
        const a = 1 - (clock - b.land) / 0.35, r = 2 + (1 - a) * 4;
        brush([[b.x - r, b.y - 1], [b.x - r * 1.6, b.y - 2.6]], BR.fine, 1601, false, a); brush([[b.x + r, b.y - 1], [b.x + r * 1.6, b.y - 2.6]], BR.fine, 1602, false, a);
        continue;
      }
      const pts = ellipsePts(b.x, b.y, 2.2, 2.7, 12);
      ctx.fillStyle = COL.paper; ctx.fill(polyPath(pts)); brush(pts, BR.fine, 1603, true, 0.9);
      ctx.fillStyle = rgbaOf(COL.glint, 0.95); ctx.beginPath(); ctx.arc(b.x - 0.7, b.y - 0.9, 0.75, 0, TAU); ctx.fill();
    } else if (b.land < 0){ ctx.fillStyle = rgbaOf(COL.graphite, 0.7); ctx.beginPath(); ctx.arc(b.x, b.y, 0.9, 0, TAU); ctx.fill(); }
  }
}
function glintOn(ch){ const n = ch.nodes; if (n.length < 3) return; const p = n[1 + Math.floor(Math.random() * (n.length - 2))]; if (!DEAD[p]) glints.push({p, t0: clock + rnd(0, 0.3), r: rnd(3.2, 5.2)}); }
function glintsUpdate(dt){
  if (glints.length) glints = glints.filter(g => clock - g.t0 < 0.8 && !DEAD[g.p]);
  if (phase !== 'clear' || !clr || clr.step === 'cheer') return;
  if ((glintT -= dt) > 0) return;
  glintT = rnd(0.3, 0.9);
  const live = CHAINS.filter(ch => !ch.dead && !ch.snapped && ch.type === 'sticky');
  if (live.length) glintOn(live[Math.floor(Math.random() * live.length)]);
}
function drawGlints(){
  for (const g of glints){
    const a = (clock - g.t0) / 0.8; if (a < 0) continue;
    const e = Math.sin(Math.PI * clamp(a, 0, 1)), x = SX[g.p], y = SY[g.p], r = g.r * e, d = r * 0.42;
    if (r < 0.4) continue;
    ctx.lineCap = 'round'; ctx.strokeStyle = rgbaOf(COL.glint, 0.95 * e); ctx.lineWidth = 0.85;
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x - d, y + d); ctx.lineTo(x + d, y - d); ctx.stroke();
    ctx.fillStyle = rgbaOf(COL.glint, e); ctx.beginPath(); ctx.arc(x, y, 0.5 + 0.7 * e, 0, TAU); ctx.fill();
  }
}

/* ---------- drips from the eaves: now and then a drop falls from each spot along the edge of the roof, and cuts any thread in its way ---------- */
let drips = [], dripToast = false, splashes = [];
function dripsUpdate(dt){
  if (!drips.length) return;
  for (const d of drips){
    d.next -= dt;
    if (d.next <= 0){ d.next = d.every * rnd(0.8, 1.2); d.drops.push({x: d.x, y: d.y0, vy: 30}); }
    for (const q of d.drops){
      const ya = q.y; q.vy = Math.min(q.vy + 1100 * dt, 900); q.y += q.vy * dt;
      if (cutUnder(q.x, ya, Math.min(q.y, d.y1)) && phase === 'build' && !dripToast){ dripToast = true; toast('낙숫물에 줄이 끊겼어요. 물방울이 떨어지는 데를 가로지르는 실은 못 버텨요.', 4.5); }
      if (q.y >= d.y1){ q.dead = true; splashes.push({x: q.x, y: d.y1, t0: clock}); }
    }
    if (d.drops.some(q => q.dead)) d.drops = d.drops.filter(q => !q.dead);
  }
  if (splashes.length) splashes = splashes.filter(s => clock - s.t0 < 0.3);
}
function cutUnder(x, ya, yb){
  // every thread that crosses the drop's path in this step is cut where it crosses
  let any = false;
  for (let y = ya; y <= yb + 8; y += 8){
    forNear(x, y, 10, i => {
      if (DEAD[i] || KIND[i] !== K_THREAD) return;
      for (const c of ADJ[i]){
        if (CB[c] || CCH[c] < 0) continue;
        const j = CI[c] === i ? CJ[c] : CI[c], x0 = X[i], x1 = X[j];
        if ((x0 - x) * (x1 - x) > 0 && Math.min(Math.abs(x0 - x), Math.abs(x1 - x)) > 1.6) continue;
        const t = Math.abs(x1 - x0) < 1e-6 ? 0.5 : clamp((x - x0) / (x1 - x0), 0, 1), yc = lerp(Y[i], Y[j], t);
        if (yc < ya - 3 || yc > yb + 3) continue;
        breakC(c); any = true;
      }
    });
  }
  return any;
}
function crossesDrip(pts){
  for (const d of drips) for (let k = 1; k < pts.length; k++){
    const a = pts[k - 1], b = pts[k];
    if ((a[0] - d.x) * (b[0] - d.x) > 0) continue;
    const t = Math.abs(b[0] - a[0]) < 1e-6 ? 0.5 : (d.x - a[0]) / (b[0] - a[0]), y = lerp(a[1], b[1], t);
    if (y > d.y0 - 2 && y < d.y1 + 2) return true;
  }
  return false;
}
function drawDripLines(){
  // where the drops fall: a row of pale blue dots from the edge of the roof down
  if (!drips.length || !(phase === 'build' || phase === 'test' || phase === 'result')) return;
  const B = new Path2D();
  for (const d of drips) for (let y = d.y0 + 12; y < d.y1 - 4; y += 10){ B.moveTo(d.x + 1.4, y); B.arc(d.x, y, 1.4, 0, TAU); }
  ctx.fillStyle = rgbaOf(COL.water, 0.6); ctx.fill(B);
}
function drawDrops(){
  for (const d of drips) for (const q of d.drops){
    const L = clamp(q.vy / 120, 0.6, 4.5), pts = [[q.x, q.y - 2.6 - L], [q.x + 1.3, q.y - 1.6], [q.x + 2.3, q.y + 0.2], [q.x + 1.6, q.y + 1.9], [q.x, q.y + 2.5], [q.x - 1.6, q.y + 1.9], [q.x - 2.3, q.y + 0.2], [q.x - 1.3, q.y - 1.6]];
    ctx.fillStyle = rgbaOf(COL.water, 0.95); ctx.fill(polyPath(pts));
    brush(pts, BR.fine, 1700 + Math.round(q.x), true, 0.8);
  }
  for (const s of splashes){
    const a = (clock - s.t0) / 0.3, r0 = 2 + a * 5, r1 = r0 + 4;
    for (const an of [-2.5, -2.0, -1.15, -0.65]) brush([[s.x + Math.cos(an) * r0, s.y + Math.sin(an) * r0], [s.x + Math.cos(an) * r1, s.y + Math.sin(an) * r1]], BR.fine, 1720 + Math.round(an * 10), false, 1 - a, rgbaOf(COL.water, 0.95), rgbaOf(COL.water, 0.6));
  }
}

/* ---------- physics ---------- */
let clock = 0, grav = 170, damp = 0.992, wreckWind = 0;
const STEP = 1 / 120, ITER = 10, THREAD_G = 30;
let stage = null, stageIdx = 0, stageInfo = null;
let gustBoost = 0, stormK = 0;
function gustOf(t){ return 1 + 0.32 * Math.sin(t * 0.8) + 0.18 * Math.sin(t * 2.3 + 1.1) + gustBoost; }
function windVec(){
  const w = stage ? stage.wind : [0, 0];
  const g = gustOf(clock);
  const a = 0.22 * Math.sin(clock * 0.47), c = Math.cos(a), s = Math.sin(a);
  return [(w[0] * c - w[1] * s) * g, (w[0] * s + w[1] * c) * g];
}
function physics(dt){
  const n = X.length, g = grav * dt * dt, gT = Math.min(grav, THREAD_G) * dt * dt, d2 = dt * dt;
  const w = windVec(), wf = 0.18 + wreckWind * 1.6, tt = clock;
  for (let o = 0; o < objBase.length; o++) OOFF[o] = objOffset(o);
  for (let i = 0; i < n; i++){
    if (DEAD[i]) continue;
    if (PIN[i]){
      const p = applyXf(OBJ[i] >= 0 ? OOFF[OBJ[i]] : null, BX[i], BY[i]);
      X[i] = p[0]; Y[i] = p[1]; PX[i] = X[i]; PY[i] = Y[i]; Z[i] = 0; PZ[i] = 0;
      continue;
    }
    if (STK[i]) continue;
    const vx = (X[i] - PX[i]) * damp, vy = (Y[i] - PY[i]) * damp, vz = (Z[i] - PZ[i]) * damp;
    PX[i] = X[i]; PY[i] = Y[i]; PZ[i] = Z[i];
    const inv = INV[i];
    let ax = FX[i] * inv, ay = FY[i] * inv, az = 0;
    if (KIND[i] === K_THREAD){
      ax += w[0] * wf * (0.7 + 0.3 * Math.sin(tt * 1.3 + Y[i] * 0.02)) + wreckWind * 60 * Math.sin(tt * 2.1 + Y[i] * 0.03);
      ay += w[1] * wf + wreckWind * 50 * Math.sin(tt * 1.7 + X[i] * 0.02);
      az += 9 * Math.sin(tt * 0.9 + X[i] * 0.013 + Y[i] * 0.007) + wreckWind * 40 * Math.sin(tt * 1.4 + Y[i] * 0.02);
    }
    X[i] += vx + ax * d2; Y[i] += vy + (KIND[i] === K_THREAD ? gT : g) + ay * d2; Z[i] += vz + az * d2;
    if (Y[i] > GROUND - 1){ Y[i] = GROUND - 1; PY[i] = Y[i]; PX[i] = X[i] - vx * 0.4; }
    FX[i] = 0; FY[i] = 0;
  }
  destroyerStep();
  const m = CI.length;
  for (let it = 0; it < ITER; it++){
    for (let c = 0; c < m; c++){
      if (CB[c] || CK[c] === 0) continue;
      const i = CI[c], j = CJ[c];
      const wi = (PIN[i] || STK[i]) ? 0 : INV[i], wj = (PIN[j] || STK[j]) ? 0 : INV[j];
      const ws = wi + wj; if (ws === 0) continue;
      const dx = X[j] - X[i], dy = Y[j] - Y[i], dz = Z[j] - Z[i];
      const dd = dx * dx + dy * dy + dz * dz, r = CR[c];
      if (dd <= r * r) continue;
      const d = Math.sqrt(dd), k = (d - r) / d * CK[c] / ws;
      X[i] += dx * k * wi; Y[i] += dy * k * wi; Z[i] += dz * k * wi;
      X[j] -= dx * k * wj; Y[j] -= dy * k * wj; Z[j] -= dz * k * wj;
    }
  }
  checkBreaks();
}
let testBroken = 0;
function checkBreaks(){
  for (const ch of CHAINS){
    if (ch.dead) continue;
    if (ch.snapped){
      let worst = -1, wr = 0;
      for (const c of ch.cons){ if (CB[c]) continue; const i = CI[c], j = CJ[c]; const r = Math.hypot(X[j] - X[i], Y[j] - Y[i], Z[j] - Z[i]) / CR[c]; if (r > wr){ wr = r; worst = c; } }
      if (worst >= 0 && wr > ch.brk * 2.4) breakC(worst);
      continue;
    }
    let tot = 0, worst = -1, wr = 0;
    for (const c of ch.cons){
      const i = CI[c], j = CJ[c];
      const d = Math.hypot(X[j] - X[i], Y[j] - Y[i], Z[j] - Z[i]);
      tot += d; const r = d / CR[c]; if (r > wr){ wr = r; worst = c; }
    }
    if (worst >= 0 && (tot > ch.restTotal * ch.brk || wr > ch.brk * 2.4)) breakC(worst);
  }
}
function breakC(c){
  if (CB[c]) return;
  CB[c] = 1;
  const i = CI[c], j = CJ[c];
  const dx = X[i] - X[j], dy = Y[i] - Y[j], d = Math.hypot(dx, dy) || 1, V = FR(120, 240) * STEP;
  if (!PIN[i] && !STK[i]){ PX[i] -= dx / d * V; PY[i] -= dy / d * V; }
  if (!PIN[j] && !STK[j]){ PX[j] += dx / d * V; PY[j] += dy / d * V; }
  const ch = CCH[c] >= 0 ? CHAINS[CCH[c]] : null;
  if (ch && !ch.snapped){
    ch.snapped = true;
    if (phase === 'test') testBroken++;
    if (clock - AU.lastSnap > 0.03){ AU.lastSnap = clock; pluck(clamp((ch.type === 'sticky' ? 9000 : 6000) / Math.max(ch.cost, 8), 180, 1500), ch.type === 'sticky' ? 0.12 : 0.24, panOf(X[i])); }
  }
}

/* ---------- the spider ---------- */
const LEGDEF = [
  {hip: [8.6, 3.6], walk: [52, 40],  idle: [54, 36],  len: [26, 24, 16], kp: [-0.35, 1]},
  {hip: [6.6, 4.6], walk: [26, 52],  idle: [44, 46],  len: [25, 23, 16], kp: [-0.15, 1]},
  {hip: [4.0, 4.8], walk: [2, 36],   idle: [-22, 28], len: [16, 15, 10], kp: [0.3, 1]},
  {hip: [1.2, 4.0], walk: [-36, 44], idle: [-42, 40], len: [26, 24, 16], kp: [0.4, 1]}
];
const SPS = 1.1, SPEED = 92, SP_W = 1300, STEP_DUR = 0.1;
let sp = null;
function makeSpider(){
  const legs = [];
  for (const side of [1, -1]) LEGDEF.forEach((d, k) => legs.push({
    side, k, kp: [d.kp[0], d.kp[1] * side], hip: [d.hip[0] * SPS, d.hip[1] * side * SPS],
    walk: [d.walk[0] * SPS, d.walk[1] * side * SPS], idle: [d.idle[0] * SPS, d.idle[1] * side * SPS], rest: [0, 0], len: d.len.map(v => v * SPS),
    group: ((k % 2 === 0) === (side === 1)) ? 0 : 1, state: 'air', hold: null, to: null, t: 0, fx: 0, fy: 0, sx: 0, sy: 0, hx: 0, hy: 0, tx: 0, ty: 0
  }));
  return {state: 'walk', c: -1, t: 0, x: 0, y: 0, z: 0, h: -Math.PI / 2, vx: 0, vy: 0, ox: 0, oy: 0, legs, moving: false, dropT: 0, reachCD: 0, idleT: 0,
    lay: null, cast: null, hang: null, spi: null, reel: null, pose: 0, lastMove: [0, -1], castFails: 0, cheer: 0, hop: 0, hopW: 1, wag: 0};
}
function edgePos(){ const a = CI[sp.c], b = CJ[sp.c], t = sp.t; return [lerp(X[a], X[b], t), lerp(Y[a], Y[b], t), lerp(Z[a], Z[b], t)]; }
function placeOn(node){
  if (!(node >= 0) || !ADJ[node]) return false;
  let c = -1;
  for (const e of ADJ[node]) if (isWalk(e)){ c = e; break; }
  if (c < 0) return false;
  sp.c = c; sp.t = CI[c] === node ? 0 : 1;
  const p = edgePos(); sp.x = p[0]; sp.y = p[1]; sp.z = p[2];
  return true;
}
const SILK_K = 31.5 * SPS;   // the spinnerets sit this far behind the body's centre, at the tip of the abdomen
function spinneret(){ return [sp.x - Math.cos(sp.h) * SILK_K, sp.y - Math.sin(sp.h) * SILK_K]; }
function nearNodeAt(x, y, R){
  let best = -1, bs = 1e9;
  forNear(x, y, R, i => {
    if (!standable(i)) return;
    const d = Math.hypot(X[i] - x, Y[i] - y); if (d > R) return;
    const s = d - (KIND[i] === K_THREAD && threadDeg(i) >= 3 ? 7 : 0);
    if (s < bs){ bs = s; best = i; }
  });
  return best;
}
function tipNode(){
  // standing right at the end of a stake, stem or twig, the spider fastens at the very end (it can bend its abdomen there)
  let best = -1, bd = 9;
  forNear(sp.x, sp.y, 9, i => {
    if (DEAD[i] || KIND[i] !== K_SURF || !PIN[i]) return;
    let n = 0; for (const c of ADJ[i]) if (isWalk(c) && CCH[c] < 0) n++;
    if (n !== 1) return;
    const d = Math.hypot(X[i] - sp.x, Y[i] - sp.y);
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}
function silkNode(){
  // where a thread is fastened: the web under the spinnerets at the tip of the abdomen (silk comes out there, not at the legs).
  // at the very end of a stake or twig, that end; over empty air, the spot under the feet
  const tp = tipNode(); if (tp >= 0) return tp;
  const s = spinneret(), n = nearNodeAt(s[0], s[1], 14);
  return n >= 0 ? n : nearNode();
}
function nearNode(){
  let best = -1, bs = 1e9;
  forNear(sp.x, sp.y, 11, i => {
    if (!standable(i)) return;
    const d = Math.hypot(X[i] - sp.x, Y[i] - sp.y); if (d > 11) return;
    const s = d - (KIND[i] === K_THREAD && threadDeg(i) >= 3 ? 7 : 0);
    if (s < bs){ bs = s; best = i; }
  });
  if (best < 0 && isWalk(sp.c)) best = sp.t < 0.5 ? CI[sp.c] : CJ[sp.c];
  return best;
}
function relocate(){
  if (sp.spi && sp.spi.group && sp.spi.group.length) UNDO.push(sp.spi.group);
  sp.lay = null; sp.cast = null; sp.spi = null; sp.hang = null;
  let q = nearestStand(sp.x, sp.y, 120);
  if (q < 0) q = stageInfo.start;
  sp.state = 'walk'; placeOn(q);
}
function turnTo(target, dt, rate){ sp.h += angDiff(sp.h, target) * Math.min(1, dt * rate); }
function edgeAim(node, c){
  // which way a branch heads: a point a little way along it, so a bowed line counts by where it goes, not by its first kink
  let prev = node, cur = CI[c] === node ? CJ[c] : CI[c], len = Math.hypot(X[cur] - X[node], Y[cur] - Y[node]), guard = 0;
  while (len < 22 && guard++ < 6 && KIND[cur] === K_THREAD){
    let next = -1, cnt = 0;
    for (const e of ADJ[cur]){ if (!isWalk(e)) continue; const o = CI[e] === cur ? CJ[e] : CI[e]; if (o === prev) continue; cnt++; next = o; }
    if (cnt !== 1) break;
    len += Math.hypot(X[next] - X[cur], Y[next] - Y[cur]); prev = cur; cur = next;
  }
  const ex = X[cur] - X[node], ey = Y[cur] - Y[node], el = Math.hypot(ex, ey) || 1e-6;
  return [ex / el, ey / el];
}
function bestEdgeAt(node, dx, dy, exclude, minScore){
  let best = -1, bs = minScore;
  for (const c of ADJ[node]){
    if (c === exclude || !isWalk(c)) continue;
    const u = edgeAim(node, c), s = u[0] * dx + u[1] * dy;
    if (s > bs){ bs = s; best = c; }
  }
  return best;
}
function settle(dt){
  const p = edgePos(), k = Math.min(1, dt * 22);
  sp.x += (p[0] - sp.x) * k; sp.y += (p[1] - sp.y) * k; sp.z = p[2];
  if (sp.moving){
    // a short step backwards is shuffled without turning round, so the tip of the abdomen (where the silk comes out)
    // does not swing to the other side while you fine-tune a position; keep going backwards and it turns round
    const want = Math.atan2(sp.lastMove[1], sp.lastMove[0]), back = Math.abs(angDiff(sp.h, want)) > 2.4;
    sp.backT = back ? (sp.backT || 0) + dt : 0;
    if (!back || sp.backT > 0.45) turnTo(want, dt, 10);
  } else sp.backT = 0;
}
function walkUpdate(dt){
  if (!isWalk(sp.c)){ relocate(); return; }
  const m = inp.mag;
  sp.moving = false;
  sp.reachCD = Math.max(0, sp.reachCD - dt);
  if (m < 0.14){ sp.dropT = 0; sp.idleT += dt; settle(dt); return; }
  // setting off from standstill, the line that best matches the stick wins outright; once moving, the current line is kept unless another is clearly better
  const hyst = sp.idleT > 0.08 ? 0 : 0.06;

    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); wr(36, 'data'); dv.setUint32(40, n * 2, true);

    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return {rows, peak: +(20 * Math.log10(peak + 1e-9)).toFixed(1), nan, wav: btoa(bin)};
  }
  render();
} else requestAnimationFrame(frame);
})();
